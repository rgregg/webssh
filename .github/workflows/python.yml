name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest -r requirements.txt
      - run: pytest

  js:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # `ls` fails loudly if the glob matches nothing, e.g. after a test
      # file is renamed off *.test.js or moved into a subdirectory.
      # Without it, an unmatched glob is passed through to `node --test`
      # literally, which reports 0/0/0 passing and exits 0 -- a green,
      # empty, silent gate. Note the glob is also NON-RECURSIVE: a future
      # tests/js/<subdir>/*.test.js would not be picked up here and would
      # need this pattern updated (e.g. to also glob tests/js/**/*.test.js).
      - run: ls tests/js/*.test.js && node --test tests/js/*.test.js

  docker:
    needs: [lint, test, js]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          TAG="$(git describe --tags --always)"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --build-arg VERSION=${{ steps.version.outputs.value }} -t webssh .

      - name: Push to GHCR (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag webssh ghcr.io/rgregg/webssh:latest
          docker tag webssh ghcr.io/rgregg/webssh:${{ github.sha }}
          docker push ghcr.io/rgregg/webssh:latest
          docker push ghcr.io/rgregg/webssh:${{ github.sha }}

      - name: Push to GHCR (PR branch)
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          BRANCH="${{ github.head_ref }}"
          SAFE_BRANCH="$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')"
          docker tag webssh ghcr.io/rgregg/webssh:dev-${SAFE_BRANCH}
          docker push ghcr.io/rgregg/webssh:dev-${SAFE_BRANCH}
